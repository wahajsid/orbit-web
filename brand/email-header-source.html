<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #122940; }
  body { width: 576px; height: 208px; overflow: hidden; font-family: 'Archivo', sans-serif; color: #FBF7F0; -webkit-font-smoothing: antialiased; }
  .wrap { padding: 30px 36px 0; }
  .mark { display: flex; align-items: flex-end; font-size: 64px; font-weight: 500; letter-spacing: 0.005em; line-height: 0.95; }
  .a { position: relative; }
  .a i { position: absolute; left: 0.30em; bottom: 0.33em; width: 0.075em; height: 0.075em; border-radius: 50%; background: #E4A1A0; }
  .sfx { font-size: 0.3em; font-weight: 400; opacity: 0.55; padding-bottom: 0.32em; }
  .rule { height: 2px; width: 118px; background: #E4A1A0; margin-top: 16px; }
  .line { margin-top: 18px; font-size: 21px; font-weight: 500; letter-spacing: -0.012em; line-height: 1.25; }
  .kick { margin-top: 14px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #E4A1A0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><span>hys<span class="a">a<i></i></span><span class="a">a<i></i></span>b</span><span class="sfx">.ai</span></div>
    <div class="rule"></div>
    <div class="line">Your shared service team of finance agents.</div>
    <div class="kick">AI accounting &amp; reporting &middot; Dubai</div>
  </div>
</body>
</html>
